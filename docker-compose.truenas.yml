# AI Social Video Studio – TrueNAS SCALE 24.10+ (Apps → Discover → ⋮ → Install via YAML)
#
# Before installing, replace:
#   /mnt/tank/apps/video-studio   → your dataset path (5 places + env_file)
#   ghcr.io/OWNER                 → your image registry (see DEPLOYMENT.md)
#   3000                          → the host port you want (web.ports)
# and create /mnt/tank/apps/video-studio/config/studio.env from .env.example.

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    user: '568:568'
    env_file: /mnt/tank/apps/video-studio/config/studio.env
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/tank/apps/video-studio/postgres:/var/lib/postgresql/data
    shm_size: 256mb
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d studio']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1g }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: '568:568'
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--save',
        '60',
        '1',
        '--dir',
        '/data',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - /mnt/tank/apps/video-studio/redis:/data
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }

  migrate:
    image: ghcr.io/OWNER/video-studio-worker:latest
    restart: 'no'
    user: '568:568'
    command: ['node', 'apps/worker/dist/migrate.js']
    env_file: /mnt/tank/apps/video-studio/config/studio.env
    volumes:
      - /mnt/tank/apps/video-studio/data:/data
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      disable: true

  worker:
    image: ghcr.io/OWNER/video-studio-worker:latest
    restart: unless-stopped
    user: '568:568'
    env_file: /mnt/tank/apps/video-studio/config/studio.env
    volumes:
      - /mnt/tank/apps/video-studio/data:/data
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '4', memory: 4g }

  web:
    image: ghcr.io/OWNER/video-studio-web:latest
    restart: unless-stopped
    user: '568:568'
    env_file: /mnt/tank/apps/video-studio/config/studio.env
    ports:
      - '3000:3000'
    volumes:
      - /mnt/tank/apps/video-studio/data:/data
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '2', memory: 1g }
