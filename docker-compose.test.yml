# Test infrastructure: disposable Postgres + Redis on high ports, and a test
# runner image with FFmpeg for the FFmpeg / queue suites.
#   docker compose -f docker-compose.test.yml up -d postgres-test redis-test
#   docker compose -f docker-compose.test.yml run --rm tests
name: video-studio-test

services:
  postgres-test:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_test
    ports: ['55432:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d studio_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports: ['56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build: { context: ., target: test }
    environment:
      TEST_DATABASE_URL: postgres://studio:studio@postgres-test:5432/studio_test
      TEST_REDIS_URL: redis://redis-test:6379
    depends_on:
      postgres-test: { condition: service_healthy }
      redis-test: { condition: service_healthy }
    command:
      [
        'sh',
        '-c',
        'npx vitest run --project unit && npx vitest run --project integration --no-file-parallelism && npx vitest run --project ffmpeg --no-file-parallelism',
      ]
